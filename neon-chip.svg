<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Hiệu ứng phát sáng -->
    <filter id="neon-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="neon-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Lưới Blueprint (Làm nền sơ đồ) -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="micro-grid" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M 4 0 L 0 0 0 4" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Nền Lưới Kỹ thuật -->
  <rect width="400" height="400" fill="#0d1117" rx="15"/>
  <rect width="400" height="400" fill="url(#grid)" rx="15"/>
  <rect width="400" height="400" fill="url(#micro-grid)" rx="15"/>

  <!-- Tụ điện SMD dán trên Board (0402/0603 size) -->
  <g fill="#2a2d35" stroke="#777" stroke-width="1">
    <rect x="50" y="50" width="12" height="20" rx="1"/>
    <rect x="50" y="50" width="12" height="4" fill="#a0a4b8"/>
    <rect x="50" y="66" width="12" height="4" fill="#a0a4b8"/>
    
    <rect x="338" y="50" width="12" height="20" rx="1"/>
    <rect x="338" y="50" width="12" height="4" fill="#a0a4b8"/>
    <rect x="338" y="66" width="12" height="4" fill="#a0a4b8"/>

    <rect x="50" y="330" width="12" height="20" rx="1"/>
    <rect x="50" y="330" width="12" height="4" fill="#a0a4b8"/>
    <rect x="50" y="346" width="12" height="4" fill="#a0a4b8"/>
  </g>

  <!-- Dàn chân cắm (Pins) chuẩn LQFP-64 -->
  <g stroke="#00f0ff" stroke-width="2" filter="url(#neon-cyan)" opacity="0.8">
    <pattern id="pins-h" x="85" y="0" width="15" height="400" patternUnits="userSpaceOnUse">
      <line x1="7.5" y1="40" x2="7.5" y2="85" />
      <line x1="7.5" y1="315" x2="7.5" y2="360" />
    </pattern>
    <rect x="85" y="40" width="230" height="320" fill="url(#pins-h)" />

    <pattern id="pins-v" x="0" y="85" width="400" height="15" patternUnits="userSpaceOnUse">
      <line x1="40" y1="7.5" x2="85" y2="7.5" />
      <line x1="315" y1="7.5" x2="360" y2="7.5" />
    </pattern>
    <rect x="40" y="85" width="320" height="230" fill="url(#pins-v)" />
  </g>

  <!-- Bo mạch chính (Package) -->
  <rect x="85" y="85" width="230" height="230" rx="15" fill="#12151d" stroke="#ff3399" stroke-width="3" filter="url(#neon-pink)"/>

  <!-- Lỗ Vias và đường Routing Zigzag 45 độ (Chuẩn thiết kế mạch) -->
  <g fill="none" stroke="#ff3399" stroke-width="1.5" filter="url(#neon-pink)">
    <path d="M 120,85 L 120,110 L 140,130 L 140,150" />
    <path d="M 280,85 L 280,110 L 260,130 L 260,150" />
    <path d="M 85,280 L 110,280 L 130,260 L 150,260" />
    <path d="M 315,280 L 290,280 L 270,260 L 250,260" />
    <path d="M 85,120 L 110,120 L 130,140" />
    <path d="M 315,120 L 290,120 L 270,140" />
    
    <!-- Lỗ Vias -->
    <circle cx="140" cy="150" r="3"/>
    <circle cx="260" cy="150" r="3"/>
    <circle cx="150" cy="260" r="3"/>
    <circle cx="250" cy="260" r="3"/>
    <circle cx="130" cy="140" r="3"/>
    <circle cx="270" cy="140" r="3"/>
  </g>

  <!-- Bus dữ liệu chạy vào Die -->
  <g fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#neon-cyan)" opacity="0.6">
    <path d="M 200,85 V 135" />
    <path d="M 200,315 V 265" />
    <path d="M 85,200 H 135" />
    <path d="M 315,200 H 265" />
  </g>

  <!-- Lõi CPU (Silicon Die Floorplan) -->
  <rect x="135" y="135" width="130" height="130" rx="4" fill="#090b0f" stroke="#b142ff" stroke-width="2" filter="url(#neon-purple)"/>
  
  <!-- Phân khu kiến trúc lõi (SRAM, Flash, ALU, Peripherals) -->
  <g filter="url(#neon-pink)" opacity="0.8">
    <!-- Flash Memory Bank -->
    <rect x="142" y="142" width="40" height="60" rx="2" fill="none" stroke="#ff3399" stroke-width="1.5"/>
    <line x1="142" y1="157" x2="182" y2="157" stroke="#ff3399" stroke-width="1"/>
    <line x1="142" y1="172" x2="182" y2="172" stroke="#ff3399" stroke-width="1"/>
    <line x1="142" y1="187" x2="182" y2="187" stroke="#ff3399" stroke-width="1"/>
    <text x="162" y="166" font-family="monospace" font-size="8" fill="#ff3399" text-anchor="middle" transform="rotate(-90, 162, 166)">FLASH</text>

    <!-- SRAM -->
    <rect x="218" y="142" width="40" height="35" rx="2" fill="none" stroke="#ff3399" stroke-width="1.5"/>
    <text x="238" y="163" font-family="monospace" font-size="10" fill="#ff3399" text-anchor="middle">RAM</text>

    <!-- ALU / Core -->
    <rect x="190" y="185" width="68" height="72" rx="2" fill="#ff3399" opacity="0.2"/>
    <rect x="190" y="185" width="68" height="72" rx="2" fill="none" stroke="#ff3399" stroke-width="2"/>
    <!-- Nhịp xung Clock -->
    <path d="M 195,220 L 205,220 L 210,205 L 220,235 L 225,220 L 253,220" fill="none" stroke="#ffffff" stroke-width="1.5" filter="url(#neon-cyan)"/>
  </g>

  <!-- Peripherals I/O Block -->
  <rect x="142" y="210" width="40" height="47" rx="2" fill="none" stroke="#00f0ff" stroke-width="1.5" filter="url(#neon-cyan)"/>
  <text x="162" y="240" font-family="monospace" font-size="10" fill="#00f0ff" text-anchor="middle" filter="url(#neon-cyan)">I/O</text>

  <!-- Logo trung tâm -->
  <rect x="165" y="125" width="70" height="20" rx="3" fill="#0d1117" stroke="#00f0ff" stroke-width="1.5" filter="url(#neon-cyan)"/>
  <text x="200" y="140" font-family="monospace" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold" filter="url(#neon-cyan)">STM32</text>
</svg>
